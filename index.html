<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ZetGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ───────── токены ───────── */
:root{
  --bg:#0e1321; --pn:#151c2e; --pn2:#1c2540; --ln:#263049;
  --tx:#ece8dd; --mu:#8a93a8;
  --br:#e3a948; --on-br:#241707;           /* латунь: единственный акцент интерфейса */
  --rs:#e2674d; --ok:#6fcf97;
  --fd:"Unbounded","Onest",system-ui,sans-serif;
  --fb:"Onest",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme=light]{
  --bg:#e9ecf3; --pn:#f8f9fc; --pn2:#dde2ec; --ln:#c9d0df;
  --tx:#10162a; --mu:#566079; --br:#a8680f; --on-br:#fff6e6; --rs:#c4452b; --ok:#2c8a58;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
h1{font:600 24px/1.15 var(--fd);letter-spacing:-.03em}
h2{font:600 15px/1.2 var(--fd);letter-spacing:-.01em;margin:30px 0 4px}
.mu{color:var(--mu)} .sm{font-size:13px} .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .grow{flex:1;min-width:0}

/* ───────── каркас ───────── */
#view{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 92px);-webkit-overflow-scrolling:touch;transition:opacity .18s}
#view.sw{opacity:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--br);color:var(--on-br);display:grid;place-items:center;font:600 14px var(--fd)}
.wm{font:600 15px var(--fd);letter-spacing:-.02em;flex:1}
.st{padding:5px 12px;border:1px solid var(--ln);border-radius:99px;font-size:13px;font-weight:500;color:var(--mu)}
.st.pr{border-color:var(--br);color:var(--br)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 14px}


/* ───────── кодовый замок ───────── */
.dw{position:relative;width:min(300px,78vw);margin:18px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.dw svg{display:block;width:100%;height:auto;cursor:grab}
.bz{fill:none;stroke:var(--ln);stroke-width:1.5}
.ts{stroke:var(--ln);stroke-width:1} .tm{stroke:var(--mu);stroke-width:1.2} .tl{stroke:var(--tx);stroke-width:2}
.dl{fill:var(--mu);font:600 9px var(--fd);text-anchor:middle}
.hub{fill:var(--pn);stroke:var(--ln);stroke-width:1.5}
.ptr{fill:var(--br)} #dial.lock .ptr{fill:var(--rs)}
.pulse{fill:none;stroke:var(--br);stroke-width:2;opacity:0;transform-origin:150px 150px}
#dial.open .pulse{animation:pulse 1s var(--ease) 1}
#dial.open .ptr{animation:flash .9s ease-out 1}
@keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.12)}}
@keyframes flash{0%{filter:drop-shadow(0 0 0 var(--br))}35%{filter:drop-shadow(0 0 12px var(--br))}}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dc b{font:600 36px/1 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dc b.s{font-size:28px}
.dc span{margin-top:6px;font-size:12.5px;color:var(--mu)}
.state{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;color:var(--mu)}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 2.2s infinite}
.live.off{background:var(--rs);animation:none}
@keyframes live{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ───────── списки (журнал) ───────── */
.lr{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--ln);transition:opacity .15s}
.lr:last-child{border-bottom:0} .lr:active{opacity:.6}
.mg{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:600 16px var(--fd)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 14px var(--fd);color:#ff9a3d}
.dead{border-left:3px solid var(--rs);padding-left:12px}
.risk{color:var(--rs);font-size:13px}
.empty{padding:36px 0;color:var(--mu);text-align:center;max-width:300px;margin:0 auto}
.sk{height:58px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,var(--pn) 25%,var(--pn2) 50%,var(--pn) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ───────── поиск ───────── */
.search{position:sticky;top:var(--sat);z-index:5;background:var(--bg);padding:4px 0 8px;margin-top:-4px}
.sb{display:flex;gap:10px;align-items:center;height:46px;padding:0 14px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;transition:border-color .2s}
.sb:focus-within{border-color:var(--br)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0}
.fchips{display:flex;gap:18px;margin-top:10px}
.fc{padding:6px 0;font-size:14px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.fc.on{color:var(--tx);border-color:var(--br)}

/* ───────── кнопки, переключатели ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;background:var(--br);color:var(--on-br);font-weight:600;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;border:1px solid var(--ln);color:var(--tx)} .btn.bad{background:none;border:1px solid var(--rs);color:var(--rs)} .btn.full{width:100%}
.sr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--ln)} .sr:last-of-type{border-bottom:0}
.tg{flex:none;width:46px;height:26px;border-radius:8px;background:var(--pn2);position:relative;transition:background .3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:5px;background:var(--tx);transition:transform .35s var(--ease)}
.tg.on{background:var(--br)} .tg.on::after{transform:translateX(20px);background:var(--on-br)}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;font-weight:500;color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--pn2);color:var(--tx)}

/* ───────── серия ───────── */
.fh{text-align:center;margin-top:4px}
.fh .t{margin-top:10px;font:600 16px var(--fd);letter-spacing:-.01em}
.track{position:relative;height:56px;margin:26px 8px 0}
.track::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--ln)}
.tf{position:absolute;left:0;top:9px;height:2px;background:var(--br);width:0;transition:width 1.2s var(--ease) .2s}
.nd{position:absolute;top:0;transform:translateX(-50%);text-align:center;font:500 12px var(--fb);color:var(--mu)}
.nd i{display:grid;place-items:center;width:20px;height:20px;margin:0 auto 6px;border-radius:50%;background:var(--bg);border:2px solid var(--ln);transition:background .4s,border-color .4s}
.nd.ok{color:var(--tx)} .nd.ok i{background:var(--br);border-color:var(--br);color:var(--on-br)}

/* ───────── тарифы ───────── */
.pl{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--ln);transition:opacity .15s}
.pl:active{opacity:.6}
.pl b{font:600 22px/1.2 var(--fd);letter-spacing:-.03em}
.pl.best{border-left:3px solid var(--br);padding-left:14px}
.pl small{display:block;color:var(--br);font-weight:600;font-size:12px;margin-bottom:2px}

/* ───────── переписка ───────── */
#chat{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .4s var(--ease)}
#chat.open{transform:none}
.ch-h{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 16px 12px;border-bottom:1px solid var(--ln)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--ln)}
.ch-b{flex:1;overflow-y:auto;padding:14px 16px calc(var(--sab) + 24px);display:flex;flex-direction:column;gap:5px}
.day{align-self:center;font-size:12px;color:var(--mu);margin:12px 0 6px}
.b{max-width:80%;padding:9px 12px;background:var(--pn);border:1px solid var(--ln);border-radius:14px 14px 14px 4px;white-space:pre-wrap;word-wrap:break-word}
.b.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--br) 14%,var(--pn));border-color:color-mix(in srgb,var(--br) 35%,transparent)}
.b.th{align-self:flex-start}
.b.del{border-left:3px solid var(--rs)}
.b .m{display:flex;gap:10px;margin-top:4px;font-size:11px;color:var(--mu);white-space:normal}
.b .m .x{color:var(--rs)} .b .m u{text-decoration:none;color:var(--br);cursor:pointer}
.b .ed{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--pn2);font-size:13px;color:var(--mu)}
.b img{display:block;max-width:100%;border-radius:10px;margin-top:6px}
/* восстановленное сообщение: чёрная плашка уезжает при появлении в зоне видимости */
.rd{position:relative;display:inline-block}
.rd::after{content:"";position:absolute;inset:-1px -3px;background:var(--rs);border-radius:3px;transform-origin:right;transition:transform .9s var(--ease)}
.rd.seen::after{transform:scaleX(0)}

/* ───────── оверлеи ───────── */
.bd{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fade .25s both}
.sheet{width:100%;background:var(--pn);border-radius:20px 20px 0 0;padding:24px 20px calc(var(--sab) + 22px);animation:up .4s var(--ease) both}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(100%)}}
.sheet h3{font:600 18px var(--fd);letter-spacing:-.02em;margin-bottom:10px}
.sheet ol{padding-left:20px;display:grid;gap:8px;margin:10px 0 18px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);z-index:90;transform:translate(-50%,-30px);opacity:0;padding:10px 16px;border-radius:10px;background:var(--tx);color:var(--bg);font-weight:500;font-size:14px;transition:all .35s var(--ease);pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#cel{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 94%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fade .4s both}
#cel canvas{position:absolute;inset:0;width:100%;height:100%}
#cel .n{position:relative;font:600 120px/1 var(--fd);letter-spacing:-.06em;color:#fff;text-shadow:0 0 60px rgba(255,122,26,.85);font-variant-numeric:tabular-nums}
#cel .n.hit{animation:hit .6s var(--ease)}
@keyframes hit{0%{transform:scale(.7);opacity:.4}60%{transform:scale(1.08)}}
#cel .t{position:relative;margin-top:12px;font:600 18px var(--fd);color:#fff}
#cel .s{position:relative;margin-top:4px;color:rgba(255,255,255,.7)}
.demo{margin-bottom:12px;padding:8px 12px;border-left:3px solid var(--br);background:var(--pn);font-size:13px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ═══ v2: мини-ап, огонь, детализация ═══ */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,.b{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:70%;pointer-events:none;background:radial-gradient(50% 50% at 30% 30%,color-mix(in srgb,var(--br) 16%,transparent),transparent 70%),radial-gradient(40% 40% at 82% 18%,color-mix(in srgb,var(--rs) 11%,transparent),transparent 70%)}
#view{padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 110px);scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* плавающая стеклянная панель */
#tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--sab) + 12px);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px;background:color-mix(in srgb,var(--pn) 72%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid color-mix(in srgb,var(--tx) 10%,transparent);box-shadow:0 14px 36px rgba(0,0,0,.35)}
#tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:20px;color:var(--mu);font-size:11px;font-weight:500;transition:color .25s,transform .15s}
#tabs button:active{transform:scale(.92)}
#tabs button.on{color:var(--tx)}
#tabs button:not(.on) .fl{filter:saturate(.35) brightness(.9);opacity:.8}
#tabs button:not(.on) .fl path{animation:none}
#tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:20px;background:color-mix(in srgb,var(--br) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--br) 42%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .5s var(--ease)}

/* замок: свечение и латунный ободок */
.dw{isolation:isolate}
.dw::before{content:"";position:absolute;inset:-12%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--br) 22%,transparent),transparent)}
.bz{stroke:color-mix(in srgb,var(--br) 45%,var(--ln))}
.ptr{filter:drop-shadow(0 0 6px var(--br))}

/* бенто на главной */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.bento>button{text-align:left;padding:14px 16px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease),border-color .2s}
.bento.on>button{opacity:1;transform:none}
.bento.on>button:nth-child(2){transition-delay:.08s}
.bento.on>button:nth-child(3){transition-delay:.16s}
.bento>button:active{transform:scale(.97)}
.bento b{display:block;font:600 28px/1.1 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bento em{font:500 13px var(--fb);font-style:normal;letter-spacing:0;color:var(--mu);margin-left:6px}
.bento .l{display:block;margin-top:5px;font-size:12.5px;color:var(--mu)}
.bento .w{grid-column:span 2;display:flex;align-items:center;gap:14px}
.bento .w b{font-size:22px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rs);margin-right:7px;vertical-align:middle}
.bar{display:block;height:6px;border-radius:99px;background:var(--pn2);margin-top:12px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:inherit;background:var(--br);animation:grow 1s var(--ease) .4s both}
@keyframes grow{from{width:0}}

/* огонь */
.fl{overflow:visible;vertical-align:middle;filter:drop-shadow(0 0 6px rgba(255,122,26,.55))}
.fl path{transform-box:fill-box;transform-origin:50% 100%}
.fl .o{animation:fo 1.8s ease-in-out infinite}
.fl .m{animation:fm 1.25s ease-in-out infinite}
.fl .i{animation:fi .9s ease-in-out infinite}
@keyframes fo{0%,100%{transform:scale(1)}35%{transform:scale(1.03,1.06) skewX(-2deg)}70%{transform:scale(.98,.96) skewX(1.5deg)}}
@keyframes fm{0%,100%{transform:scale(1)}40%{transform:scale(1.07,1.13) skewX(2deg)}75%{transform:scale(.95,.91) skewX(-2deg)}}
@keyframes fi{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.12,1.2);opacity:1}}
.fh{text-align:center;margin-top:0}
.fx{position:relative;height:200px;display:grid;place-items:center}
.fx canvas{position:absolute;left:50%;top:-80px;width:300px;height:300px;margin-left:-150px;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.fx .fl{position:relative;filter:drop-shadow(0 0 22px rgba(255,110,20,.75))}
.fh .n{position:relative;margin-top:-4px;font:600 76px/1 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums;text-shadow:0 4px 34px rgba(255,122,26,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.stats>div{padding:12px;border-radius:16px;background:var(--pn);border:1px solid var(--ln)}
.stats b{display:block;font:600 20px/1.1 var(--fd);letter-spacing:-.03em}
.stats span{font-size:12px;color:var(--mu)}
.cs{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,#ff7a1a 14%,transparent)}
.cs b{font:600 18px var(--fd);color:#ff9a3d}

/* группы, premium, шторки */
.grp{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:2px 16px}
.feat{display:grid;gap:12px;margin:16px 0 4px;padding:16px;border-radius:20px;background:var(--pn);border:1px solid var(--ln)}
.feat>div{display:flex;gap:12px;align-items:center}
.feat i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--br) 18%,transparent);color:var(--br)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--ln);margin:-10px auto 16px}

/* ═══ v3: чёрный bento-стиль ═══ */
:root{--bg:#0a0a0b;--pn:#111113;--pn2:#1b1b1f;--ln:#242428;--tx:#f4f2ec;--mu:#8b8b94}
body::before{opacity:.55}
.card{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:28px;padding:20px;margin-top:12px}
.hero{overflow:hidden;margin-top:10px;padding:22px 20px 20px}
.hero::after{content:"";position:absolute;top:0;right:0;width:62%;height:78%;pointer-events:none;background-image:radial-gradient(circle,color-mix(in srgb,var(--tx) 60%,transparent) 1.1px,transparent 1.7px);background-size:7px 7px;-webkit-mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 68%);mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 68%)}
.hero>*{position:relative;z-index:1}
.dt{display:flex;align-items:center;gap:8px;font:600 12.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mu)}
.hh{margin-top:26px;font-size:30px;line-height:1.08}
.hero p{margin-top:8px;max-width:26ch}
.wp{display:flex;align-items:center;justify-content:center;width:100%;margin-top:22px;padding:17px 22px;border-radius:99px;background:linear-gradient(#fff,#e4e2dc);color:#0a0a0b;font-weight:600;font-size:16px;box-shadow:0 10px 30px rgba(255,255,255,.12),inset 0 -6px 12px rgba(0,0,0,.08);transition:transform .15s var(--ease)}
.wp:active{transform:scale(.97)}
.dialcard{padding:22px 16px 20px}
.dialcard .dw{margin-top:0}
.bento{margin-top:12px}
.bento>button,.stats>div,.feat,.grp{border-radius:26px}
.bento>button{padding:18px}
.stats>div{padding:16px 14px}

/* нижняя панель: плитки, активная белая */
#tabs{left:12px;right:12px;gap:8px;display:flex;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#tabs button{flex:1;flex-direction:row;justify-content:center;height:58px;padding:0;border-radius:22px;background:color-mix(in srgb,var(--pn) 86%,transparent);border:1px solid var(--ln);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:flex-grow .5s var(--ease),background .3s,color .3s,transform .15s}
#tabs button span{display:none;font-size:13px;font-weight:600;white-space:nowrap}
#tabs button.on{flex:2.5;background:var(--tx);color:var(--bg);border-color:var(--tx);box-shadow:0 8px 26px rgba(255,255,255,.14)}
#tabs button.on span{display:block;margin-left:8px}
#tabs .ind{display:none}
</style>
</head>
<body>

/* ───────── утилиты ───────── */
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const mono = (name, id) => { const h = hue(id); return `<div class="mg" style="background:linear-gradient(135deg,hsl(${h} 40% 32%),hsl(${(h + 45) % 360} 45% 20%));color:hsl(${h} 70% 86%)">${esc((name || "?").trim()[0] || "?").toUpperCase()}</div>`; };
const tm = iso => new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const dayLbl = iso => {

const ago = iso => new Date(iso).toDateString() === new Date().toDateString() ? tm(iso) : new Date(iso).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });

function premTxt(u) {

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
function countUp(el, to, dur = 900) {

/* ───────── огонь (canvas, частицы) ───────── */
function fire(canvas, o = {}) {
  const sc = o.scale || 1, rate = o.rate || 1, c = canvas.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; c.scale(dpr, dpr);
  const U = Math.min(W, H), base = o.base || .82, light = document.documentElement.dataset.theme === "light", P = [];

  const api = { burst(n = 60) { for (let i = 0; i < n; i++) spark(W / 2, H * (o.by || .55), 6, 1); } };

        P.push({ x0, x: x0, y: cy, rise: U * (.38 + Math.random() * .28) * sc / max, wob: (Math.random() - .5) * U * .09, ph: Math.random() * 6, r: U * (.05 + Math.random() * .045) * sc, l: 0, max }); }
      if (Math.random() < .5 * rate) spark(W / 2 + (Math.random() - .5) * U * .1, cy - U * .1, 1.2, 2.4);
    }
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.l++; const k = p.l / p.max;
      if (k >= 1) { P.splice(i, 1); continue; }
      if (p.sp) { p.vy += .06; p.x += p.vx; p.y += p.vy; c.fillStyle = `rgba(255,${190 - k * 90 | 0},70,${1 - k})`; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); continue; }
      p.y -= p.rise * (1 - k * .35); p.x = p.x0 + (W / 2 - p.x0) * k * .7 + Math.sin(p.l * .12 + p.ph) * p.wob * (1 - k);

    }
    requestAnimationFrame(frame);
  })();

}

/* ───────── кодовый замок ───────── */
function dialSVG(locked) {
  let ticks = "", labels = "";
  for (let i = 0; i < 100; i++) {
    const long = i % 10 === 0, mid = i % 5 === 0, r1 = long ? 112 : mid ? 118 : 122;
    ticks += `<line x1="150" y1="${150 - r1}" x2="150" y2="18" transform="rotate(${i * 3.6} 150 150)" class="${long ? "tl" : mid ? "tm" : "ts"}"/>`;
  }
  for (let i = 0; i < 100; i += 10) labels += `<text x="150" y="${150 - 98}" transform="rotate(${i * 3.6} 150 150)" class="dl">${i}</text>`;
  return `<svg id="dial" class="${locked ? "lock" : ""}" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="144" class="bz"/><circle class="pulse" cx="150" cy="150" r="144"/><g id="ring">${ticks}${labels}</g><circle cx="150" cy="150" r="84" class="hub"/><path class="ptr" d="M140 2h20l-10 18z"/></svg>`;
}
function initDial() {
  const svg = $("#dial"); if (!svg) return;
  const ring = $("#ring"), cnt = $("#dn"), trio = $(".trio"), total = S.me.stats.archive, STEP = 3.6;
  let a = 0, v = 0, drag = null, last = 0, intro = !S.intro && !REDUCE;
  const set = x => { a = x; ring.setAttribute("transform", `rotate(${a.toFixed(2)} 150 150)`); const k = Math.floor(a / STEP); if (k !== last) { last = k; tick(); } };
  const done = () => {
    intro = false; S.intro = true; set(0); svg.classList.add("open"); hap("medium");
    countUp(cnt, total, 1000); trio && trio.classList.add("on");
    $$("[data-n]").forEach(e => countUp(e, +e.dataset.n));
  };
  const ang = e => { const r = svg.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); if (intro) done(); drag = { p: ang(e), t: performance.now() }; v = 0; });
  svg.addEventListener("pointermove", e => {
    if (!drag) return; const p = ang(e), now = performance.now(); let d = p - drag.p;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    v = d / Math.max(1, now - drag.t) * 16; drag.p = p; drag.t = now; set(a + d);
  });
  const up = () => { drag = null; }; svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);

  if (!intro) { cnt.textContent = num(total); trio && trio.classList.add("on"); $$("[data-n]").forEach(e => { e.textContent = num(e.dataset.n); }); }
  const t0 = performance.now(), A0 = -900;
  (function loop(now) {
    if (!svg.isConnected) return;
    if (intro) { const t = Math.min(1, (now - t0) / 2000); set(A0 * Math.pow(1 - t, 4)); if (t >= 1) done(); }
    else if (!drag && Math.abs(v) > .02) { set(a + v); v *= .95; }
    requestAnimationFrame(loop);
  })(t0);
}
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ───────── API / демо ───────── */
async function api(action, p = {}) {

  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function demo(a, p) {

}
function vArchive() {
  const F = [["all", "Все"], ["deleted", "Удалённые"], ["edited", "Изменённые"]];
  return `<div class="head"><h1>Архив</h1></div><div class="search"><div class="sb">${ic("search", 18)}<input id="q" placeholder="Поиск по сообщениям" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></div>
  <div class="fchips">${F.map(([k, l]) => `<button class="fc ${S.filter === k ? "on" : ""}" data-a="filter" data-f="${k}">${l}</button>`).join("")}</div></div><div id="ab">${archiveBody()}</div>`;
}

const MS = [7, 30, 50, 100, 365];
function trackPct(b) {   // позиции узлов 10/30/50/70/90 %, между ними линейно
  if (b >= MS[4]) return 100;
  if (b < MS[0]) return (b / MS[0]) * 10;
  for (let k = 0; k < 4; k++) if (b < MS[k + 1]) return 10 + 20 * k + ((b - MS[k]) / (MS[k + 1] - MS[k])) * 20;
  return 90;
}
function vStreak() {
  const ch = (S.chats || []).slice().sort((a, b) => b.cur - a.cur || b.best - a.best), top = ch[0];
  const best = Math.max(0, ...ch.map(c => c.best));
  const act = ch.filter(c => c.cur > 0).length, risk = ch.filter(c => c.at_risk).length;
  const hero = top && top.cur > 0
    ? `<div class="fh"><div class="fx"><canvas id="fh"></canvas>${flame(120)}</div><div class="n" data-n="${top.cur}">0</div><div class="t">Серия вместе</div><div class="mu sm" style="margin-top:4px">с ${esc(top.chat_name)}${top.today_done ? ", сегодня уже засчитан" : top.at_risk ? ", напишите сегодня" : ""}</div></div>`
    : `<div class="empty" style="padding-top:20px"><div style="display:grid;place-items:center;height:96px">${flame(72)}</div><p style="margin-top:12px">Серия растёт, когда вы оба пишете друг другу хотя бы раз за день. Начните сегодня.</p></div>`;
  const stats = `<div class="stats"><div><b>${best}</b><span>рекорд</span></div><div><b>${act}</b><span>активных</span></div><div><b>${risk}</b><span>под угрозой</span></div></div>`;
  return `<div class="head"><h1>Серии</h1></div>${hero}${stats}
  <div class="track"><div class="tf" data-w="${trackPct(best)}"></div>${MS.map((n, i) => `<div class="nd ${best >= n ? "ok" : ""}" style="left:${10 + i * 20}%"><i>${best >= n ? ic("check", 11) : ""}</i>${n}</div>`).join("")}</div>
  <h2>Все чаты</h2><div>${ch.length ? ch.map(c => `<button class="lr" data-a="chat" data-id="${c.chat_id}">${mono(c.chat_name, c.chat_id)}<div class="grow"><b class="ell">${esc(c.chat_name)}</b><div class="mu sm">рекорд ${c.best} ${plural(c.best, "день", "дня", "дней")}</div>${c.at_risk ? '<div class="risk">под угрозой</div>' : ""}</div><span class="chip">${c.cur > 0 ? flame(16) : ""}${c.cur}</span></button>`).join("") : '<div class="empty">Пока нет переписок.</div>'}</div>`;
}

function vPrem() {
  const u = S.me.user, P = S.me.plans;
  return `<div class="head"><h1>Premium</h1><span class="mu sm">${esc(premTxt(u))}</span></div>
  <div class="feat">${["Больше запросов к AI", "Модели мощнее", "Архив хранится до 90 дней"].map(x => `<div><i>${ic("check", 14)}</i><span>${x}</span></div>`).join("")}</div>
  <div style="margin-top:14px">${Object.entries(P).map(([s, d]) => `<button class="pl ${d === 30 ? "best" : ""}" data-a="buy" data-s="${s}"><div>${d === 30 ? "<small>Выгоднее всего</small>" : ""}<b>${d} ${plural(d, "день", "дня", "дней")}</b><div class="mu sm">${(s / d).toFixed(1)} ⭐ в день</div></div><b>${s} ⭐</b></button>`).join("")}</div>
  ${!u.trial_used ? '<button class="btn ghost full" style="margin-top:20px" data-a="trial">Попробовать 7 дней бесплатно</button>' : ""}`;
}

function vSet() {
  const u = S.me.user;
  const sw = (k, v) => `<button class="tg ${v ? "on" : ""}" data-a="tog" data-k="${k}" role="switch" aria-checked="${!!v}"></button>`;
  const seg = (a, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(cur) === String(v) ? "on" : ""}" data-a="${a}" data-v="${v}">${l}</button>`).join("")}</div>`;
  const off = u.tz_min, tz = "UTC" + (off >= 0 ? "+" : "−") + Math.floor(Math.abs(off) / 60) + (Math.abs(off) % 60 ? ":" + String(Math.abs(off) % 60).padStart(2, "0") : "");
  return `<div class="head"><h1>Настройки</h1></div><div class="grp">
  <div class="sr"><div><b>Сохранять сообщения</b><div class="mu sm">Архив подключённых чатов</div></div>${sw("antidelete", u.antidelete)}</div>
  <div class="sr"><div><b>Уведомления</b><div class="mu sm">Когда сообщение удалили или изменили</div></div>${sw("notify", u.notify)}</div>
  <div class="sr"><div><b>Срок хранения</b><div class="mu sm">Дней. 90 доступно в Premium</div></div>${seg("ret", [[7, "7"], [30, "30"], [90, "90"]], u.retention_days)}</div>
  <div class="sr"><b>Тема</b>${seg("theme", [["auto", "Авто"], ["light", "Светлая"], ["dark", "Тёмная"]], S.theme)}</div>
  <div class="sr"><b>Часовой пояс</b><span class="mu">${tz}</span></div>
  </div><button class="btn bad full" style="margin-top:24px" data-a="wipe">Удалить мои данные</button>`;
}

function render(anim) {
  const v = $("#view"); tabs();
  if (!S.me) { v.innerHTML = skeleton(); return; }
  v.innerHTML = { home: vHome, archive: vArchive, streak: vStreak, prem: vPrem, set: vSet }[S.tab]();
  if (S.tab === "home") initDial();
  else $$("[data-n]").forEach(e => countUp(e, +e.dataset.n));
  const fh = $("#fh"); if (fh) fire(fh, { base: .74 });
  const tf = $(".tf"); if (tf) requestAnimationFrame(() => requestAnimationFrame(() => { tf.style.width = tf.dataset.w + "%"; }));
}
function go(k) {
  if (k === S.tab) return;
  const v = $("#view"); v.classList.add("sw"); hap();
  setTimeout(() => { S.tab = k; v.scrollTop = 0; render(); v.classList.remove("sw"); if (["archive", "streak", "home"].includes(k)) loadChats(); }, 140);
}

/* ───────── данные ───────── */
function refreshBody() {
  if (S.tab === "archive") { const ab = $("#ab"); if (ab) ab.innerHTML = archiveBody(); }
  else if (S.tab === "streak" || (S.tab === "home" && S.intro)) render();
}
async function loadChats() {
  try {
    const old = JSON.stringify(S.chats), nw = (await api("chats")).chats;
    S.chats = nw;
    if (old !== JSON.stringify(nw) && !S.q && S.filter === "all") refreshBody();
    celebrate();
  } catch (e) { if (S.chats === null) S.chats = []; }
}
async function search() {
  S.res = null; const ab = $("#ab"); if (ab) ab.innerHTML = skeleton();
  try { S.res = (await api("messages", { q: S.q, filter: S.filter, limit: 50 })).messages; } catch (e) { S.res = []; }
  const a2 = $("#ab"); if (a2) a2.innerHTML = archiveBody();
}
async function refreshMe() { S.me = await api("me"); render(); }

/* ───────── переписка ───────── */
let io;
function observeRedacted() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { setTimeout(() => e.target.classList.add("seen"), 350); io.unobserve(e.target); } }), { threshold: .8, root: $("#cb") });
  $$(".rd").forEach(n => REDUCE ? n.classList.add("seen") : io.observe(n));
}
function bubbles() {
  let last = "", h = "";
  S.msgs.forEach(m => {
    const d = dayLbl(m.sent_at); if (d !== last) { h += `<div class="day">${d}</div>`; last = d; }
    const me = m.from_id === S.me.user.id, ed = m.edits && m.edits.length;
    const txt = m.text ? (m.deleted_at ? `<span class="rd">${esc(m.text)}</span>` : esc(m.text)) : "";
    const media = m.type === "photo" ? `<div><button class="btn ghost" style="padding:7px 12px;margin-top:4px" data-a="photo" data-id="${m.id}">Показать фото</button></div><div id="ph${m.id}"></div>` : (!m.text ? `<span class="mu">[${typeLbl[m.type] || m.type}]</span>` : "");
    h += `<div class="b ${me ? "me" : "th"} ${m.deleted_at ? "del" : ""}">${txt}${media}<div class="ed" id="ed${m.id}" hidden>${ed ? m.edits.map(e => `<div>Было: ${esc(e.text)}</div>`).join("") : ""}</div><div class="m"><span>${tm(m.sent_at)}</span>${m.deleted_at ? '<span class="x">удалено, но сохранено</span>' : ""}${ed ? `<u data-a="edits" data-id="${m.id}">изменено</u>` : ""}</div></div>`;
  });
  return h || '<div class="empty">В этом чате пока нет сохранённых сообщений.</div>';
}
function paintChat(keepScroll) {
  const cb = $("#cb"), prev = cb.scrollHeight;
  cb.innerHTML = (S.more ? '<button class="btn ghost" data-a="older">Загрузить ранее</button>' : "") + bubbles();
  cb.scrollTop = keepScroll ? cb.scrollHeight - prev : cb.scrollHeight;
  observeRedacted();
}
async function openChat(id) {
  if (!id) return;
  const c = (S.chats || []).find(x => String(x.chat_id) === String(id));
  S.chat = c || { chat_id: id, chat_name: "Чат", cur: 0 }; hap();
  const el = $("#chat");
  el.innerHTML = `<div class="ch-h"><button class="ib" data-a="back" aria-label="Назад">${ic("back", 20)}</button>${mono(S.chat.chat_name, S.chat.chat_id)}<div class="grow"><b class="ell">${esc(S.chat.chat_name)}</b>${S.chat.msgs ? `<div class="mu sm">${num(S.chat.msgs)} ${plural(S.chat.msgs, "сообщение", "сообщения", "сообщений")}</div>` : ""}</div>${S.chat.cur > 0 ? `<div class="cs" title="Серия вместе">${flame(24)}<b>${S.chat.cur}</b></div>` : ""}</div><div class="ch-b" id="cb">${skeleton()}</div>`;
  requestAnimationFrame(() => el.classList.add("open"));
  try { const r = await api("messages", { chat_id: id, limit: 60 }); S.msgs = r.messages.slice().reverse(); S.more = r.more; } catch (e) { S.msgs = []; }
  paintChat(false);
  if (tg) { tg.BackButton.show(); tg.BackButton.onClick(closeChat); }
}
function closeChat() { $("#chat").classList.remove("open"); S.chat = null; io && io.disconnect(); if (tg) { tg.BackButton.hide(); tg.BackButton.offClick(closeChat); } }

/* ───────── оверлеи ───────── */
function sheet(html) {
  const b = document.createElement("div"); b.className = "bd"; b.innerHTML = `<div class="sheet">${html}</div>`;
  b.addEventListener("click", e => { if (e.target === b || e.target.closest("[data-close]")) b.remove(); });
  document.body.appendChild(b); return b;
}
function celebrate() {
  if (!S.chats || DEMO) return;
  let pick = null;
  S.chats.forEach(c => { const k = "s" + c.chat_id, seen = +localStorage[k] || 0; if (c.cur > seen && seen > 0 && c.today_done && (!pick || c.cur > pick.cur)) pick = { ...c, seen }; localStorage[k] = c.cur; });
  if (!pick) return;
  const o = document.createElement("div"); o.id = "cel";
  o.innerHTML = `<canvas></canvas><div style="position:relative">${flame(120)}</div><div class="n">${pick.seen}</div><div class="t">Серия вместе</div><div class="s">с ${esc(pick.chat_name)}</div>`;
  document.body.appendChild(o); hap("heavy");
  const f = fire($("canvas", o), { scale: 1.5, rate: 1.2, by: .5, base: .42 }), n = $(".n", o);
  setTimeout(() => { n.textContent = pick.cur; n.classList.add("hit"); f.burst(120); hap("medium"); }, 700);
  setTimeout(() => f.burst(70), 1400);
  o.addEventListener("click", () => o.remove()); setTimeout(() => o.remove(), 4200);
}

/* ───────── действия ───────── */
const A = {
  tab: d => go(d.k),
  chat: d => openChat(d.id),
  back: closeChat,
  filter: d => {
    if (S.tab !== "archive") { S.tab = "archive"; S.chats === null && loadChats(); }
    S.filter = S.filter === d.f ? "all" : d.f; render(); hap();
    (S.q || S.filter !== "all") ? search() : loadChats();
  },
  edits: d => { const e = $("#ed" + d.id); e.hidden = !e.hidden; },
  photo: async d => {
    const t = $("#ph" + d.id); t.innerHTML = '<div class="sk" style="height:120px;margin-top:6px"></div>';
    try { t.innerHTML = `<img alt="Фото из архива" src="${(await api("photo", { id: +d.id })).src}">`; } catch (e) { t.innerHTML = ""; toast("Фото не загрузилось. Попробуй ещё раз"); }
  },
  older: async () => {
    try { const r = await api("messages", { chat_id: S.chat.chat_id, before: S.msgs[0].id, limit: 60 }); S.msgs = r.messages.slice().reverse().concat(S.msgs); S.more = r.more; paintChat(true); }
    catch (e) { toast("Не удалось загрузить. Попробуй ещё раз"); }
  },
  howto: () => sheet(`<h3>Подключение</h3><ol><li>Открой Настройки Telegram, раздел Business, затем Чат-боты.</li><li>Выбери этого бота.</li><li>Разреши доступ к нужным чатам.</li></ol><p class="mu sm" style="margin-bottom:16px">Для этого нужен Telegram Premium.</p><button class="btn full" data-close>Понятно</button>`),
  buy: async d => {
    if (DEMO) return toast("В демо-режиме оплата недоступна");
    try { const { link } = await api("invoice", { stars: +d.s }); tg.openInvoice(link, st => { if (st === "paid") { hap("medium"); toast("Premium включён"); setTimeout(refreshMe, 1200); } }); }
    catch (e) { toast("Счёт не создался. Попробуй ещё раз"); }
  },
  trial: async () => { try { await api("trial"); toast("Пробный период включён"); hap("medium"); refreshMe(); } catch (e) { toast("Пробный период уже использован"); } },
  tog: async d => { const u = S.me.user; u[d.k] = !u[d.k]; render(); hap(); try { await api("settings", { [d.k]: u[d.k] }); } catch (e) { u[d.k] = !u[d.k]; render(); toast("Настройка не сохранилась"); } },
  ret: async d => {
    const u = S.me.user, v = +d.v, old = u.retention_days;
    if (v === 90 && !u.premium) return toast("Срок 90 дней доступен в Premium");
    u.retention_days = v; render();
    try { await api("settings", { retention_days: v }); } catch (e) { u.retention_days = old; render(); toast("Настройка не сохранилась"); }
  },
  theme: d => { S.theme = d.v; localStorage.th = d.v; applyTheme(); render(); },
  wipe: () => {
    const b = sheet(`<h3>Удалить все данные?</h3><p class="mu" style="margin-bottom:16px">Архив, серии и история AI будут стёрты без возможности восстановления. Платежи и Premium сохранятся.</p><button class="btn bad full" data-yes>Удалить данные</button><button class="btn ghost full" style="margin-top:8px" data-close>Отмена</button>`);
    $("[data-yes]", b).onclick = async () => { b.remove(); try { await api("wipe"); toast("Данные удалены"); S.chats = []; refreshMe(); } catch (e) { toast("Не удалось удалить. Попробуй ещё раз"); } };
  },
};
document.addEventListener("click", e => { const a = e.target.closest("[data-a]"); if (a && A[a.dataset.a]) A[a.dataset.a](a.dataset, a); });
let qt; document.addEventListener("input", e => {
  if (e.target.id !== "q") return; clearTimeout(qt);
  qt = setTimeout(() => { S.q = e.target.value.trim(); (S.q || S.filter !== "all") ? search() : refreshBody(); }, 300);
});

/* ───────── старт ───────── */
(async function init() {
  applyTheme(); render();
  try { await refreshMe(); loadChats(); }
  catch (e) { $("#view").innerHTML = '<div class="empty">Не удалось загрузить данные. Проверь соединение.<br><br><button class="btn" onclick="location.reload()">Повторить</button></div>'; }
})();
</script>
</body>
</html>
