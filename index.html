<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Юзернеймы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0c;--c1:#141518;--c2:#1b1c20;--st:rgba(255,255,255,.075);--fg:#f3f3f2;--hint:#8a8c94;--or:#ff7a1a;--white:#f4f4f2;
--common:#8a8c94;--rare:#5aa7ff;--epic:#b78cff;--legendary:#ff9f3c;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#17181d 0,var(--bg) 60%) no-repeat,var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;padding:calc(14px + env(safe-area-inset-top)) 12px calc(138px + env(safe-area-inset-bottom))}
main{max-width:500px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* базовая плитка */
.card{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--st);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.lab{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--hint)}

/* шапка с растром */
.hero{position:relative;overflow:hidden;min-height:156px;padding:16px 18px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:space-between}
.dots{position:absolute;inset:0;pointer-events:none;opacity:.9;
background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.55) 0 1.9px,transparent 2.6px);background-size:6px 6px,12px 12px;background-position:0 0,3px 3px;
-webkit-mask-image:linear-gradient(118deg,transparent 28%,#000 100%);mask-image:linear-gradient(118deg,transparent 28%,#000 100%);-webkit-mask-size:170% 170%;mask-size:170% 170%;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:100% 100%;mask-position:100% 100%}}
.hero>*:not(.dots){position:relative}
.hero h1{margin:0;font-size:38px;line-height:1;letter-spacing:-.035em;font-weight:700;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero p{margin:8px 0 0;font-size:14px;color:var(--hint);max-width:70%}
.hero .sw{transition:opacity .22s,transform .22s var(--ease)}
.hero .sw.off{opacity:0;transform:translateY(6px)}

/* страницы */
.page{display:none}
.page.on{display:block}
.page.on>*{animation:rise .55s var(--ease) both}
.page.on>*:nth-child(2){animation-delay:60ms}.page.on>*:nth-child(3){animation-delay:120ms}
.page.on>*:nth-child(4){animation-delay:180ms}.page.on>*:nth-child(5){animation-delay:240ms}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* плитки настроек */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{position:relative;text-align:left;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s var(--ease),border-color .3s}
.tile:active{transform:scale(.965)}
button.tile:hover{border-color:rgba(255,255,255,.16)}
.tile .val{font-size:46px;line-height:1;font-weight:700;letter-spacing:-.035em}
.tile .val.sm{font-size:25px;line-height:1.1;letter-spacing:-.02em}
.tile .cap{font-size:12px;color:var(--hint)}
.tile.wide{grid-column:1/-1;min-height:0}
.val.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:translateY(-5px) scale(1.07);color:var(--or)}}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch{padding:8px 14px;border-radius:999px;border:1px solid var(--st);background:rgba(255,255,255,.04);color:var(--hint);font-size:14px;transition:background .25s,color .25s,transform .15s}
.ch:active{transform:scale(.94)}
.ch.on{background:var(--white);color:#111;border-color:transparent;font-weight:600}
.ch.idea:hover{color:var(--fg)}

.box{padding:14px;margin-bottom:10px}
textarea{display:block;width:100%;min-height:78px;margin-top:10px;resize:none;padding:0;border:0;background:none;color:var(--fg);font:inherit;font-size:18px;outline:none}
textarea::placeholder{color:#5c5e66}

/* главная кнопка */
.go{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin-bottom:14px;border:0;border-radius:20px;background:var(--white);color:#111;font-size:16px;font-weight:700;transition:transform .15s,opacity .2s}
.go:active{transform:scale(.975)}
.go:disabled{opacity:.75}
.go svg{width:20px;height:20px;transition:transform .5s var(--ease)}
.go:active svg{transform:rotate(60deg)}
.go.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{margin:-4px 0 14px;text-align:center;color:var(--hint);font-size:13px}

/* результаты */
.res{--c:var(--common);position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px;margin-bottom:10px;opacity:0;animation:rise .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
.t-rare{--c:var(--rare)}.t-epic{--c:var(--epic)}.t-legendary{--c:var(--legendary)}
.res .sc{min-width:52px;font-size:36px;line-height:1;font-weight:700;letter-spacing:-.04em;color:var(--fg)}
.t-rare .sc,.t-epic .sc,.t-legendary .sc{color:var(--c)}
.res .sc small{display:block;margin-top:5px;font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--hint)}
.info{min-width:0}
.tl{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.u{margin-top:2px;font-size:21px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.m{font-size:13px;color:var(--hint)}
.why{margin-top:4px;font-size:13px;opacity:.85}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease) .25s}
.t-legendary{border-color:rgba(255,159,60,.4)}
.t-legendary::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,var(--legendary) 0 1px,transparent 1.5px);background-size:6px 6px;-webkit-mask-image:linear-gradient(225deg,#000,transparent 45%);mask-image:linear-gradient(225deg,#000,transparent 45%);animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.2}}
.acts{display:flex;gap:6px;position:relative;z-index:1}
.ib{width:38px;height:38px;padding:0;border-radius:13px;border:1px solid var(--st);background:rgba(255,255,255,.05);display:grid;place-items:center;transition:transform .15s,background .2s,color .2s}
.ib:active{transform:scale(.88)}
.ib svg{width:18px;height:18px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.ib.on{color:var(--or);background:rgba(255,122,26,.14)}
.ib.on svg{fill:currentColor;transform:scale(1.15)}
.res.out{animation:out .35s forwards}
@keyframes out{to{opacity:0;transform:translateX(50px) scale(.92)}}

.sk{height:80px;margin-bottom:10px;border-radius:22px;border:1px solid var(--st);background:linear-gradient(100deg,var(--c1) 30%,#23242a 50%,var(--c1) 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.msg{text-align:center;color:var(--hint);padding:14px 0;transition:opacity .2s;animation:rise .4s var(--ease) both}
.msg .go{margin:14px 0 0}

/* Pro */
.pro{padding:18px}
.big{display:block;margin:10px 0 16px;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.feat{list-style:none;margin:0 0 18px;padding:0}
.feat li{position:relative;padding:11px 0 11px 22px;border-top:1px solid var(--st);color:var(--fg)}
.feat li::before{content:"";position:absolute;left:2px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--or)}

/* нижняя панель */
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100vw - 16px),484px);display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;gap:6px;align-items:center;z-index:20}
.dock::before{content:"";position:absolute;left:-12px;right:-12px;top:-26px;bottom:calc(-10px - env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 62%,transparent);z-index:-1;pointer-events:none}
.nt{position:relative;height:62px;padding:8px 8px 8px 9px;border-radius:18px;border:1px solid var(--st);background:linear-gradient(180deg,var(--c2),var(--c1));text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:background .35s,color .35s,transform .2s var(--ease)}
.nt i{align-self:flex-end;font-style:normal;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums;transition:color .3s}
.nt span{font-size:10.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.nt:active{transform:scale(.94)}
.nt.on{background:var(--white);color:#111;border-color:transparent;transform:translateY(-3px)}
.nt.on i{color:var(--or)}
.bd{position:absolute;top:7px;left:9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--or);color:#111;font-size:10px;font-weight:700;font-style:normal;line-height:16px;text-align:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.bd.on{transform:scale(1)}
.core{position:relative;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:#0d0d0f;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg),inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .2s var(--ease)}
.core::before{content:"";position:absolute;inset:-9px;border-radius:50%;pointer-events:none;opacity:.6;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:6px 6px;-webkit-mask-image:radial-gradient(closest-side,transparent 76%,#000 79%,#000 92%,transparent 100%);mask-image:radial-gradient(closest-side,transparent 76%,#000 79%,#000 92%,transparent 100%);animation:spin 26s linear infinite}
.core:active{transform:scale(.93)}
.core svg{position:relative;width:30px;height:30px;transition:transform .6s var(--ease)}
.core:active svg{transform:rotate(60deg)}
.core.busy svg{animation:spin 1s linear infinite}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-90px);padding:11px 18px;border-radius:999px;background:var(--white);color:#111;font-size:14px;font-weight:600;z-index:70;transition:transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<main>
  <section class="card hero">
    <div class="dots"></div>
    <span class="lab sw" id="hl"></span>
    <div>
      <h1 class="sw" id="ht">Поиск</h1>
      <p class="sw" id="hs"></p>
    </div>
  </section>

  <section class="page on" id="p-search">
    <div class="set" data-style="1"></div>
    <button class="go" id="go"><span class="ico" data-ic="aperture"></span><span id="gol">Найти</span></button>
    <div id="out-search"></div>
  </section>

  <section class="page" id="p-ai">
    <div class="card box">
      <span class="lab">Опиши идею</span>
      <textarea id="q" maxlength="200" placeholder="Например: кофейня с уютным настроением"></textarea>
      <div class="chips2" id="chips"></div>
    </div>
    <div class="set" data-style="0"></div>
    <button class="go" id="goai"><span class="ico" data-ic="aperture"></span><span>Подобрать с ИИ</span></button>
    <p class="note" id="ainote"></p>
    <div id="out-ai"></div>
  </section>

  <section class="page" id="p-fav">
    <div id="out-fav"></div>
  </section>

  <section class="page" id="p-pro">
    <div class="card pro">
      <span class="lab">Статус</span>
      <b class="big" id="pro-stat">Загружаю…</b>
      <ul class="feat">
        <li>Юзернеймы из 5 символов</li>
        <li>До 30 запросов к ИИ в сутки</li>
        <li>Поиск на Fragment без ограничений по длине</li>
      </ul>
      <button class="go" id="buy" style="margin:0"><span>Купить Pro</span></button>
      <p class="note" id="pro-left" style="margin:12px 0 0"></p>
    </div>
  </section>
</main>

<nav class="dock" id="dock">
  <button class="nt on" data-p="search"><i>01</i><span>Поиск</span></button>
  <button class="nt" data-p="ai"><i>02</i><span>ИИ</span></button>
  <button class="core" id="core" aria-label="Выполнить"><span data-ic="aperture"></span></button>
  <button class="nt" data-p="fav"><em class="bd" id="bd"></em><i>03</i><span>Избранное</span></button>
  <button class="nt" data-p="pro"><i>04</i><span>Pro</span></button>
</nav>

<script>
// Адрес Edge Function «usernames» в твоём Supabase-проекте
const API = "https://orbnmhcyrwfnphvaoorm.supabase.co/functions/v1/usernames";
const tg = window.Telegram?.WebApp || {initData: "", ready() {}, expand() {}, onEvent() {}};
tg.ready(); tg.expand();
try { tg.setHeaderColor("#0a0a0c"); tg.setBackgroundColor("#0a0a0c"); } catch {}
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const hap = (k = "light") => { try { tg.HapticFeedback.impactOccurred(k); } catch {} };

/* иконки */
const IC = {
  aperture: '<circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/>',
  heart: '<path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6.5 5 5 0 0 1 21.2 11C19 15.6 12 20 12 20z"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  spark: '<path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
$$("[data-ic]").forEach(e => e.innerHTML = ic(e.dataset.ic));

/* состояние */
const S = {len: "6", mode: "free", style: "any"};
let me = {pro: false, ai_on: false, ai_left: 0, price: 150, days: 30, until: 0};
let CUR = "search";

/* плитки настроек: нажатие на плитку меняет значение */
const STYLES = [["any", "Любой"], ["pron", "Читаемые"], ["word", "Слова"], ["rep", "Повторы"]];
$$(".set").forEach(c => {
  c.className = "grid";
  c.innerHTML = `<button class="card tile" data-cyc="len"><span class="lab">Длина</span><b class="val" data-v="len"></b><span class="cap" data-cap="len"></span></button>
<button class="card tile" data-cyc="mode"><span class="lab">Какие</span><b class="val sm" data-v="mode"></b><span class="cap" data-cap="mode"></span></button>` +
  (c.dataset.style === "1" ? `<div class="card tile wide"><span class="lab">Стиль</span><div class="chips2">${STYLES.map(([v, t]) => `<button class="ch" data-v="${v}">${t}</button>`).join("")}</div></div>` : "");
});
function setVal(e, t) { if (e.textContent !== t) { e.textContent = t; e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop"); } }
function paint() {
  $$('[data-v="len"]').forEach(e => setVal(e, S.len));
  $$('[data-v="mode"]').forEach(e => setVal(e, S.mode === "free" ? "Свободные" : "Платные"));
  $$('[data-cap="len"]').forEach(e => e.textContent = S.len === "5" ? "символов, нужен Pro" : "символов, нажми для смены");
  $$('[data-cap="mode"]').forEach(e => e.textContent = S.mode === "paid" ? "выставлены на Fragment" : "можно занять сразу");
  $$(".ch[data-v]").forEach(c => c.classList.toggle("on", c.dataset.v === S.style));
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-cyc]");
  if (t) { if (t.dataset.cyc === "len") S.len = S.len === "6" ? "5" : "6"; else S.mode = S.mode === "free" ? "paid" : "free"; paint(); hap(); return; }
  const c = e.target.closest(".ch[data-v]");
  if (c) { S.style = c.dataset.v; paint(); hap(); }
});
paint();

/* уведомление */
let tt; function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => e.classList.remove("on"), 1900); }

/* всплеск точек для легендарных */
function confetti() {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = $("#fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({length: 90}, () => ({x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 2, r: Math.random() * 2.5 + 1.5, h: 18 + Math.random() * 30, l: 70}));
  (function f() {
    x.clearRect(0, 0, c.width, c.height); let a = 0;
    P.forEach(p => { if (p.l <= 0) return; a++; p.x += p.vx; p.y += p.vy; p.vy += .3; p.l--; x.globalAlpha = Math.max(0, p.l / 70); x.fillStyle = `hsl(${p.h} 100% 58%)`; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.3); x.fill(); });
    if (a) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* избранное: хранится на сервере, общее с ботом */
let FAV = [];
const isFav = u => FAV.some(x => x.u === u);
function badge() { const n = FAV.length, b = $("#bd"); b.textContent = n; b.classList.toggle("on", n > 0); }
function toggleFav(i, btn) {
  const on = !isFav(i.u);
  if (on) { FAV.unshift({u: i.u, score: i.score, tier: i.tier, price: i.price, why: i.why}); btn.classList.add("on"); toast("Сохранено в избранное"); }
  else { FAV = FAV.filter(x => x.u !== i.u); btn.classList.remove("on"); toast("Убрано из избранного"); }
  badge(); hap("medium");
  api("/fav", {u: i.u, on, price: i.price, why: i.why}).catch(() => {});
}

/* карточка результата */
const NAME = {common: "Обычный", rare: "Редкий", epic: "Эпический", legendary: "Легендарный"};
function count(e, to) { const t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0) / 900); e.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function card(i, idx, o = {}) {
  const d = el("div", "card res t-" + i.tier); d.style.setProperty("--i", idx);
  d.innerHTML = '<div class="sc"><span class="n">0</span><small>/100</small></div><div class="info"><div class="tl"></div><div class="u"></div><div class="m"></div></div><div class="acts"></div><i class="bar"></i>';
  $(".tl", d).textContent = NAME[i.tier];
  $(".u", d).textContent = "@" + i.u;
  $(".m", d).textContent = i.price === "0" ? "бесплатно" : i.price + " TON";
  if (i.why) $(".info", d).append(el("div", "why", i.why));
  const acts = $(".acts", d);
  const b = (cls, icon, fn) => { const x = el("button", "ib " + cls); x.innerHTML = ic(icon); x.onclick = fn; acts.append(x); return x; };
  const h = b(isFav(i.u) ? "on" : "", "heart", () => { toggleFav(i, h); if (o.fav) { d.classList.add("out"); setTimeout(() => { d.remove(); if (!FAV.length) renderFav(); }, 350); } });
  b("", "copy", () => navigator.clipboard.writeText(i.u).then(() => { toast("Скопировано: @" + i.u); hap(); }, () => tg.showAlert?.("@" + i.u)));
  if (i.price !== "0") b("", "ext", () => { const u = "https://fragment.com/username/" + i.u; tg.openLink ? tg.openLink(u) : open(u, "_blank"); });
  else b("", "spark", () => aiRun(i.u));
  requestAnimationFrame(() => requestAnimationFrame(() => { $(".bar", d).style.transform = `scaleX(${i.score / 100})`; count($(".n", d), i.score); }));
  return d;
}

/* вывод */
let tm;
const stop = () => clearInterval(tm);
const busy = on => { $("#core").classList.toggle("busy", on); $$(".go").forEach(g => g.classList.toggle("busy", on)); };
function say(out, t) { stop(); out.replaceChildren(el("div", "msg", t)); }
function skeleton(out, ph) {
  out.replaceChildren(el("div", "msg", ph[0]), ...[0, 1, 2, 3].map(() => el("div", "sk")));
  const p = out.firstChild; let k = 0; stop();
  tm = setInterval(() => { k = (k + 1) % ph.length; p.style.opacity = 0; setTimeout(() => { p.textContent = ph[k]; p.style.opacity = 1; }, 200); }, 2200);
}
function render(out, items, o) {
  stop();
  if (!items.length) return say(out, "Ничего не нашлось. Повтори поиск.");
  out.replaceChildren(...items.map((i, k) => card(i, k, o)));
  if (items.some(i => i.tier === "legendary")) { setTimeout(confetti, 350); hap("heavy"); } else hap();
}
function needPro(out) {
  say(out, "5 символов доступны в Pro.");
  const b = el("button", "go", "Открыть Pro"); b.onclick = () => nav("pro"); out.firstChild.append(b);
}

/* API */
const api = (p, b = {}) => fetch(API + p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({...b, initData: tg.initData})}).then(r => r.json());
async function loadMe() {
  try { me = {...me, ...await api("/me")}; } catch { return; }
  if (Array.isArray(me.favs)) { FAV = me.favs; badge(); }
  $("#pro-stat").textContent = me.pro ? (me.until > Date.now() / 1000 ? "Pro до " + new Date(me.until * 1000).toLocaleDateString("ru") : "Pro активен") : "Бесплатный план";
  $("#buy span").textContent = `Купить Pro на ${me.days || 30} дней за ${me.price} ★`;
  $("#pro-left").textContent = me.ai_on ? `ИИ-запросов на сегодня: ${me.ai_left}` : "ИИ пока не подключён";
  aiNote();
}
function aiNote() { $("#ainote").textContent = me.ai_on ? `Осталось ИИ-запросов сегодня: ${me.ai_left}` : "ИИ пока не подключён администратором"; }

$("#buy").onclick = async () => {
  const r = await api("/invoice");
  if (r.link) tg.openInvoice(r.link, s => { if (s === "paid") { toast("Pro включён"); hap("heavy"); confetti(); setTimeout(loadMe, 1500); } });
};

/* поиск */
$("#go").onclick = async () => {
  const out = $("#out-search"), btn = $("#go"); btn.disabled = true; busy(true);
  skeleton(out, ["Генерирую кандидатов…", "Проверяю свободные…", "Считаю редкость…"]);
  try {
    const r = await api("/search", {...S, len: +S.len});
    if (r.error === "pro") needPro(out);
    else if (r.error === "wait") say(out, "Подожди 5 секунд и повтори.");
    else if (!r.items) say(out, "Не получилось. Открой приложение через Telegram и повтори.");
    else render(out, r.items);
  } catch { say(out, "Нет связи. Повтори поиск."); }
  finally { btn.disabled = false; busy(false); }
};

/* ИИ */
async function aiRun(seed) {
  const out = $("#out-ai"), btn = $("#goai"), prompt = $("#q").value.trim();
  if (!seed && !prompt) { toast("Опиши, что нужно"); hap("medium"); return $("#q").focus(); }
  if (seed) nav("ai");
  btn.disabled = true; busy(true);
  skeleton(out, seed ? [`Ищу похожие на @${seed}…`, "Проверяю свободные…", "Считаю редкость…"] : ["ИИ придумывает варианты…", "Проверяю свободные…", "Считаю редкость…"]);
  try {
    const r = await api("/ai", {len: +S.len, mode: S.mode, prompt, seed});
    if (r.error === "pro") needPro(out);
    else if (r.error === "wait") say(out, "Подожди 8 секунд и повтори.");
    else if (r.error === "limit") say(out, "Лимит ИИ-запросов на сегодня закончился. В Pro их больше.");
    else if (r.error === "noai") say(out, "ИИ пока не подключён. Администратору нужно добавить ключи командой /addkey.");
    else if (r.error === "aierr") say(out, "ИИ сейчас не отвечает. Повтори через минуту.");
    else if (!r.items) say(out, "Не получилось. Открой приложение через Telegram и повтори.");
    else { render(out, r.items); me.ai_left = r.left; aiNote(); }
  } catch { say(out, "Нет связи. Повтори запрос."); }
  finally { btn.disabled = false; busy(false); }
}
$("#goai").onclick = () => aiRun();
["Кофейня и уют", "Гейминг", "Дизайнер", "Крипта", "Космос", "Короткое и звучное"].forEach(t => {
  const c = el("button", "ch idea", t); c.onclick = () => { $("#q").value = t; hap(); }; $("#chips").append(c);
});

/* избранное */
function renderFav() {
  const out = $("#out-fav");
  if (!FAV.length) return say(out, "Здесь появятся юзернеймы, которые ты отметишь сердцем. Список общий с ботом.");
  out.replaceChildren(...FAV.map((i, k) => card(i, k, {fav: true})));
}

/* навигация */
const PAGES = ["search", "ai", "fav", "pro"];
const HERO = {
  search: ["Поиск", "Свободные и платные, с оценкой редкости"],
  ai: ["ИИ-подбор", "Опиши идею, ИИ придумает и проверит"],
  fav: ["Избранное", "Общий список с ботом"],
  pro: ["Pro", "Подписка и лимиты"]
};
const day = new Date().toLocaleDateString("ru", {weekday: "long", day: "numeric", month: "long"});
$("#hl").textContent = day.charAt(0).toUpperCase() + day.slice(1);
function hero(p) {
  const sw = $$(".sw").slice(1); sw.forEach(e => e.classList.add("off"));
  setTimeout(() => { $("#ht").textContent = HERO[p][0]; $("#hs").textContent = HERO[p][1]; sw.forEach(e => e.classList.remove("off")); }, 200);
}
function nav(p) {
  if (p !== CUR) hero(p);
  CUR = p;
  $$(".nt").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  $$(".page").forEach(s => s.classList.toggle("on", s.id === "p-" + p));
  if (p === "fav") renderFav();
  if (p === "pro" || p === "ai") loadMe();
  hap(); scrollTo({top: 0, behavior: "smooth"});
}
$$(".nt").forEach(b => b.onclick = () => nav(b.dataset.p));
/* центральная кнопка выполняет главное действие текущего экрана */
$("#core").onclick = () => {
  if (CUR === "search") $("#go").click();
  else if (CUR === "ai") $("#goai").click();
  else if (CUR === "pro") $("#buy").click();
  else { hap(); scrollTo({top: 0, behavior: "smooth"}); }
};
$("#hs").textContent = HERO.search[1]; badge(); loadMe();
</script>
</body>
</html>
