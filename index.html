const plural = (n, a) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? a[2] : m > 1 && m < 5 ? a[1] : m === 1 ? a[0] : a[2]; };
const fmt = n => Number(n || 0).toLocaleString("ru-RU");
const hue = id => (Math.abs(Number(id) || 0) * 47 + 190) % 360;
const ini = n => (String(n || "?").trim().replace(/^[^\p{L}\p{N}]+/u, "")[0] || "?").toUpperCase();
const av = (name, id, cls = "") => `<span class="av ${cls}" style="--h:${hue(id)}">${esc(ini(name))}</span>`;
const hm = d => new Date(d).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function ago(d) {
  const t = new Date(d), n = new Date(), m = (n - t) / 6e4;
  if (m < 1) return "сейчас"; if (m < 60) return Math.floor(m) + " мин";
  if (sameDay(t, n)) return hm(t);
  if (sameDay(t, new Date(n - 864e5))) return "вчера";
  return t.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}
function dayLabel(d) {
  const t = new Date(d), n = new Date();
  if (sameDay(t, n)) return "Сегодня"; if (sameDay(t, new Date(n - 864e5))) return "Вчера";
  return t.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: t.getFullYear() === n.getFullYear() ? undefined : "numeric" });
}

/* ═══ запросы: таймаут, повторы ═══ */
async function api(action, p = {}) {
  if (DEMO) return demo(action, p);
  const body = JSON.stringify({ action, tz: -new Date().getTimezoneOffset(), ...p });
  let last;
  for (let i = 0; i < 3; i++) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), i ? 15000 : 8000);
    try {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-init-data": tg.initData }, body, signal: ac.signal });
      const j = await r.json().catch(() => ({}));
      if (r.status >= 500 && i < 2) { last = new Error(j.error || r.status); await sleep(400 * (i + 1)); continue; }
      if (!r.ok) throw Object.assign(new Error(j.error || r.status), { final: true });
      return j;
    } catch (e) { last = e; if (e && e.final) throw e; if (i < 2) await sleep(400 * (i + 1)); }
    finally { clearTimeout(t); }
  }
  throw last;
}

function unsheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }

/* ═══ данные ═══ */
async function refreshMe() { try { S.me = await api("me"); save("me", S.me); } catch (e) { if (!S.me) throw e; } render(); }
async function loadChats() {
  try { const r = await api("chats"); S.chats = r.chats || []; save("chats", S.chats); } catch (e) { if (!S.chats) S.chats = []; }
  if (S.tab === "chats" && !S.admin) { render(); }
}
let rt = 0;
function retry() {
  if (!S.me) { $("#app").innerHTML = `<div class="top"><h1>ZetGram</h1></div>${sk(3)}<div class="empty">Подключаемся…</div>`; }
  setTimeout(async () => { try { await refreshMe(); loadChats(); } catch (e) { if (++rt < 10) retry(); else $("#app").innerHTML = `<div class="empty"><b>Нет связи с сервером</b><br><button class="btn" style="margin-top:16px" onclick="location.reload()">Повторить</button></div>`; } }, 2500);
}

/* ═══ действия ═══ */
const A = {
  tab: d => { S.tab = d.k; render(); hap("light"); if (d.k === "chats" && !S.chats) loadChats(); $("#app").scrollTop = 0; },
  cf: d => { S.cf = d.k; render(); },
  open: d => { hap(); openChat(d.id, d.n); },
  close: closeChat,
  older: async () => { try { await loadMsgs(true); paintChat(false); } catch (e) { toast("Не удалось загрузить"); } },
  mf: async d => { S.mf = d.k; try { await loadMsgs(); } catch (e) {} paintChat(true); },
  amode: async d => { S.admin = d.k === "1"; render(); if (S.admin && !S.owners) { try { const r = await api("admin_owners"); S.owners = r.owners || []; } catch (e) { S.owners = []; } render(); } },
  owner: async d => { S.owner = +d.id; S.chats = null; render(); try { const r = await api("admin_chats", { owner_id: S.owner }); S.chats = r.chats || []; } catch (e) { S.chats = []; } render(); },
  ownback: () => { S.owner = null; S.chats = load("chats"); render(); },
  tog: async d => { const u = S.me.user; u[d.k] = !u[d.k]; render(); hap(); try { await api("settings", { [d.k]: u[d.k] }); save("me", S.me); } catch (e) { u[d.k] = !u[d.k]; render(); toast("Настройка не сохранилась"); } },
  ret: async d => { const u = S.me.user, v = +d.k, old = u.retention_days; if (v === 90 && !u.premium) { toast("90 дней доступно в Premium"); S.tab = "prof"; render(); return; } u.retention_days = v; render(); hap(); try { await api("settings", { retention_days: v }); } catch (e) { u.retention_days = old; render(); toast("Настройка не сохранилась"); } },
  theme: d => { localStorage.setItem("zg:theme", d.k); applyTheme(); render(); hap(); },
  exp: async () => { try { await api("export"); toast("Файл отправлен в чат с ботом"); hap("medium"); } catch (e) { toast("Не удалось собрать файл"); } },
  wipeq: () => sheet(`<h2>Удалить все данные?</h2><p class="mu">Архив сообщений и настройки будут стёрты без возможности восстановления.</p><button class="btn bad" data-a="wipe">Удалить</button><button class="btn sec" data-a="unsheet">Отмена</button>`),
  unsheet,
  wipe: async () => { unsheet(); try { await api("wipe"); S.chats = []; localStorage.removeItem("zg:chats"); toast("Данные удалены"); refreshMe(); } catch (e) { toast("Не удалось удалить"); } },
  copy: d => { try { navigator.clipboard.writeText(d.v); } catch (e) {} toast("ID скопирован"); hap(); },
  buy: async d => { try { const { link } = await api("invoice", { stars: +d.s }); tg.openInvoice(link, st => { if (st === "paid") { hap("medium"); toast("Premium включён"); setTimeout(refreshMe, 1200); } }); } catch (e) { toast("Не удалось создать счёт"); } },
  trial: async () => { try { await api("trial"); toast("Пробный период включён"); hap("medium"); refreshMe(); } catch (e) { toast("Пробный период уже использован"); } },
};
document.addEventListener("click", e => { const t = e.target.closest("[data-a]"); if (!t) return; const f = A[t.dataset.a]; if (f) f(t.dataset); });
$("#scrim").addEventListener("click", unsheet);
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; $("#cl").innerHTML = chatRows((S.chats || []).filter(c => (S.cf === "all" || c.deleted_cnt > 0) && (!S.q.trim() || String(c.chat_name || "").toLowerCase().includes(S.q.trim().toLowerCase()) || String(c.username || "").toLowerCase().includes(S.q.trim().toLowerCase())))); }
  if (e.target.id === "mq") { S.mq = e.target.value; clearTimeout(window.__mt); window.__mt = setTimeout(async () => { try { await loadMsgs(); } catch (x) {} paintChat(true); }, 350); }
});
try { tg.BackButton.onClick(() => { if (S.chat) closeChat(); }); } catch (e) {}

/* ═══ старт: мгновенный показ из кеша, обновление в фоне ═══ */
(function init() {
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  applyTheme(); try { tg.onEvent && tg.onEvent("themeChanged", () => { applyTheme(); }); } catch (e) {}
  S.me = DEMO ? null : load("me"); S.chats = DEMO ? null : load("chats");
  render();
  refreshMe().then(loadChats).catch(retry);
})();
</script>
</body>
</html>
